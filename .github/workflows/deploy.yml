name: Deploy

# Deploys the review app to production (`env.production` in apps/web/wrangler.jsonc, pixelslash.dev) from CI,
# so a fix ships without the maintainer's shell. The steps are apps/web/README.md's "Deploy to Cloudflare",
# in its order: build, migrate, deploy, check the live commit, smoke.
#
# Two ways in:
# - A push to main: `ci` waits for that commit's CI run (ci.yml, the push on main) and goes on only when it
#   succeeded, then `deploy` deploys that head sha.
# - A manual run (workflow_dispatch) with a sha, `main` by default: the same, for a commit on main whose CI
#   push run succeeded. That is how a deploy someone rejected is run again, or an older commit rolled back to.
#
# This waits on CI from inside a push run rather than triggering on `workflow_run`, which
# scripts/check-workflows.ts refuses: a fork's pull request can drive a workflow_run with secrets.
#
# `deploy` runs in the `production` environment. Only `main` may deploy to it, it has a required reviewer
# (every deploy waits for one approval), and it alone holds the secrets: CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID and SMOKE_TOKEN (the smoke account's token, apps/web/smoke). Its setup is in
# apps/web/README.md. Actions are pinned to a commit; the tag is in the comment.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: The commit on main to deploy (a sha, or main for its tip)
        required: true
        default: main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # CI on main takes about half an hour; the wait is bounded by this.
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      go: ${{ steps.wait.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # The commit to deploy, in full, and on main: a manual run may name a sha, never one off main. The run's
      # summary names the commit and its subject, so the approver sees what a manual run deploys.
      - id: sha
        env:
          WANTED: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
        run: |
          wanted="$(printf '%s' "$WANTED" | tr -d '\r\n')"
          sha="$(git rev-parse --verify --quiet "${wanted}^{commit}")" || {
            echo "::error::$wanted is not a commit in this repository"
            exit 1
          }
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main"
            exit 1
          fi
          echo "deploying $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploys \`$sha\`"
            echo
            git log -1 --format='%s' "$sha"
          } >> "$GITHUB_STEP_SUMMARY"
      # Every 30 s: on a push, stop with no deploy once main has moved past the sha (the newer push's run
      # deploys); then read the newest CI push run on main for the sha and its jobs. Only CI's own jobs
      # decide: changes, gate, web (which may be skipped: changes runs it only when the push touched the
      # app) and example. visual uploads to pixelslash.dev itself, so a broken production would fail the CI
      # of the fix that restores it, and visual and self-host flakes would block every deploy. All passed:
      # deploy. Any of them ended otherwise (failed, cancelled, skipped, or missing from a finished run):
      # fail. A push whose CI run has not appeared in 10 minutes ([skip ci], say) fails, and
      # a manual run with none fails at once: a commit inside a push of several never had a run of its own.
      # Five API errors in a row fail.
      - name: Wait for CI on that commit
        id: wait
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          required="changes gate web example"
          errors=0
          misses=0
          while true; do
            if [ "$errors" -ge 5 ]; then
              echo "::error::the GitHub API failed 5 times in a row"
              exit 1
            fi
            if [ "$EVENT" = "push" ]; then
              if ! git fetch --quiet origin main; then
                errors=$((errors + 1))
                sleep 30
                continue
              fi
              if [ "$(git rev-parse origin/main)" != "$SHA" ]; then
                echo "::notice::main has moved past $SHA; the newer push's run deploys"
                echo "go=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            if ! run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&per_page=1" \
              --jq '.workflow_runs[0] | select(.) | "\(.id) \(.status) \(.html_url)"')"; then
              errors=$((errors + 1))
              echo "the runs API did not answer; asking again"
              sleep 30
              continue
            fi
            if [ -z "$run" ]; then
              if [ "$EVENT" != "push" ]; then
                echo "::error::no CI push run on main for $SHA; pick a commit that was the head of a push to main"
                exit 1
              fi
              misses=$((misses + 1))
              if [ "$misses" -ge 20 ]; then
                echo "::error::no CI run for $SHA after 10 minutes (was CI skipped?)"
                exit 1
              fi
              errors=0
              echo "no CI run for $SHA yet"
              sleep 30
              continue
            fi
            read -r id status url <<< "$run"
            if ! jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | "\(.name) \(.status) \(.conclusion)"')"; then
              errors=$((errors + 1))
              echo "the jobs API did not answer; asking again"
              sleep 30
              continue
            fi
            errors=0
            passed=0
            for name in $required; do
              line="$(printf '%s\n' "$jobs" | awk -v n="$name" '$1 == n' | tail -n 1)"
              read -r _ job_status conclusion <<< "$line"
              echo "CI $url: $name ${job_status:-not started} $conclusion"
              if [ -z "$line" ]; then
                if [ "$status" = "completed" ]; then
                  echo "::error::CI on $SHA finished without a $name job: $url"
                  exit 1
                fi
              elif [ "$job_status" = "completed" ]; then
                # web runs only when the push changed the app ("changes" decides, and must itself pass).
                if [ "$conclusion" != "success" ] && ! { [ "$name" = "web" ] && [ "$conclusion" = "skipped" ]; }; then
                  echo "::error::CI's $name job on $SHA ended $conclusion: $url"
                  exit 1
                fi
                passed=$((passed + 1))
              fi
            done
            if [ "$passed" -eq 4 ]; then
              echo "go=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done

  deploy:
    name: Deploy ${{ needs.ci.outputs.sha }}
    needs: ci
    if: needs.ci.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One production deploy at a time, and a running one is never cancelled (a deploy cut short could
    # leave the migrations applied and the Worker not). GitHub keeps one running and one pending job per
    # group, and a newer job replaces the pending one, cancelled. Its docs do not say whether a job waiting
    # for approval is the running one or the pending one, so assume either: a deploy left waiting can block
    # the ones behind it, and a newer deploy can cancel one that is waiting, a manual rollback included.
    # A rollback that shows cancelled is dispatched again.
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://pixelslash.dev
    env:
      SHA: ${{ needs.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.ci.outputs.sha }}
          # moon diffs the head against MOON_BASE before any task runs (the smoke step), so the full history.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
      # A push run approved after main moved on would ship an older commit than the tip: it fails here,
      # deploying nothing, and the newer push's run deploys. It fails rather than passing so the environment
      # never records a deployment of a commit that is not live. A manual run deploys the sha it names (a
      # rollback).
      - name: Still main's tip
        if: github.event_name == 'push'
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$SHA" ]; then
            echo "::error::main has moved past $SHA, so it is not deployed; the newer push's run deploys"
            exit 1
          fi
      - run: bun install --frozen-lockfile
      # Without CLOUDFLARE_ENV=production the build is the top level's (placeholder D1, no route), and
      # wrangler deploy would publish a different Worker.
      - name: Build env.production
        working-directory: apps/web
        run: CLOUDFLARE_ENV=production bun run build
      # Before the deploy that needs them; the only step that changes the database.
      - name: Apply the D1 migrations
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply pixelslash --remote --env production
      - name: Deploy the Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --var SENTRY_RELEASE:"$(git rev-parse --short HEAD)"
      # The live page names the commit it was built from (apps/web/build-commit.ts); up to two minutes.
      - name: Check the live commit
        run: bun scripts/check-commit.ts https://pixelslash.dev/ "$SHA"
      - name: Smoke
        env:
          MOON_BASE: origin/main
          SMOKE_BASE_URL: https://pixelslash.dev
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: bunx moon run web:smoke
